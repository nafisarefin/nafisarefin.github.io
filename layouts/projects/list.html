{{- define "main" }}

<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>

{{- with .Content }}
<div class="post-content" style="max-width:800px;margin:0 auto 1rem;">{{ . }}</div>
{{- end }}

<div class="project-grid">
  {{- range .Pages.ByWeight }}
  <a class="project-card" href="{{ .Permalink }}">
    {{- with .Params.thumb }}
    <img class="project-image" src="{{ . }}" alt="{{ $.Title }}">
    {{- end }}
    <div class="project-info">
      <div class="project-title">{{ .Title }}</div>
      {{- with .Params.summary }}
      <div class="project-desc">{{ . }}</div>
      {{- end }}
    </div>
  </a>
  {{- end }}
</div>

{{- end }}
